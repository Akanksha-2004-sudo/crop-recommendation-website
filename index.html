<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Crop Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('{{ url_for('static', filename='images/home1.jpg') }}');
            background-size: cover;
            background-position: center;
        }

        .content {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5); /* Optional: Add a dark overlay for contrast */
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body class="home">
    <div class="content">
        <h1>Welcome to the Crop Recommendation System</h1>
        <button onclick="window.location.href='/input'">Get Recommendations</button>
    </div>
</body>
</html>
