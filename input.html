<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation - Crop Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .input {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('{{ url_for('static', filename='images/crop_background.jpg') }}');
            background-size: cover;
            background-position: center;
        }

        .content {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5); /* Optional: Add a dark overlay for contrast */
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            color: white;
            font-size: 1em;
            margin: 10px 0 5px;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body class="input">
    <div class="content">
        <h1>Enter Your Details</h1>
        <form method="POST" action="/predict">
            <label for="state_name">State Name:</label>
            <input type="text" name="state_name" id="state_name" required>

            <label for="crop_type">Crop Type:</label>
            <input type="text" name="crop_type" id="crop_type" required>

            <label for="nitrogen">Nitrogen (N):</label>
            <input type="number" name="nitrogen" id="nitrogen" step="0.01" required>

            <label for="phosphorus">Phosphorus (P):</label>
            <input type="number" name="phosphorus" id="phosphorus" step="0.01" required>

            <label for="potassium">Potassium (K):</label>
            <input type="number" name="potassium" id="potassium" step="0.01" required>

            <label for="ph">pH Value:</label>
            <input type="number" name="ph" id="ph" step="0.01" required>

            <label for="rainfall">Rainfall (mm):</label>
            <input type="number" name="rainfall" id="rainfall" step="0.01" required>

            <label for="temperature">Temperature (°C):</label>
            <input type="number" name="temperature" id="temperature" step="0.01" required>

            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
